<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440">
  <defs>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#20284f"/>
      <stop offset="1" stop-color="#0c1027"/>
    </linearGradient>
    <radialGradient id="screen" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0" stop-color="#1c1450"/>
      <stop offset="0.55" stop-color="#0b0c2a"/>
      <stop offset="1" stop-color="#05060f"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#f1ecff"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262f5e"/>
      <stop offset="1" stop-color="#0b0f25"/>
    </linearGradient>
    <linearGradient id="keys" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <!-- lid -->
  <rect x="92" y="14" width="456" height="300" rx="16" fill="url(#lid)" stroke="#36407a" stroke-width="2"/>
  <rect x="108" y="30" width="424" height="262" rx="6" fill="url(#screen)"/>
  <!-- a small black hole on the screen -->
  <circle cx="320" cy="160" r="96" fill="url(#halo)"/>
  <g fill="#ffffff" opacity="0.7">
    <circle cx="150" cy="60" r="1.2"/><circle cx="200" cy="250" r="1"/><circle cx="470" cy="70" r="1.4"/><circle cx="500" cy="230" r="1"/><circle cx="260" cy="70" r="0.9"/><circle cx="410" cy="260" r="1.1"/><circle cx="140" cy="180" r="1"/><circle cx="520" cy="150" r="0.9"/>
  </g>
  <ellipse cx="320" cy="162" rx="110" ry="20" fill="none" stroke="url(#ring)" stroke-width="7" opacity="0.5" filter="url(#blur)"/>
  <path d="M212 165 A110 20 0 0 0 428 160" fill="none" stroke="url(#ring)" stroke-width="5" opacity="0.4"/>
  <circle cx="320" cy="160" r="40" fill="#000"/>
  <circle cx="320" cy="160" r="42" fill="none" stroke="#f1ecff" stroke-width="2" opacity="0.85"/>
  <path d="M210 168 A110 20 0 0 0 430 158" fill="none" stroke="url(#ring)" stroke-width="5" transform="rotate(-4 320 162)"/>
  <!-- hinge -->
  <rect x="150" y="312" width="340" height="10" rx="5" fill="#0a0d20"/>
  <!-- base -->
  <path d="M60 320 H580 L632 396 Q636 404 626 406 H14 Q4 404 8 396 Z" fill="url(#base)" stroke="#36407a" stroke-width="2"/>
  <path d="M8 398 H632" stroke="#5a66a8" stroke-width="2" opacity="0.6"/>
  <!-- keyboard glow and keys -->
  <path d="M100 328 H540 L566 368 H74 Z" fill="url(#keys)" opacity="0.35" filter="url(#blur)"/>
  <g fill="#0b0f22" stroke="url(#keys)" stroke-width="1" stroke-opacity="0.9">
    <path d="M104 330h22v8h-22zM130 330h22v8h-22zM156 330h22v8h-22zM182 330h22v8h-22zM208 330h22v8h-22zM234 330h22v8h-22zM260 330h22v8h-22zM286 330h22v8h-22zM312 330h22v8h-22zM338 330h22v8h-22zM364 330h22v8h-22zM390 330h22v8h-22zM416 330h22v8h-22zM442 330h22v8h-22zM468 330h22v8h-22zM494 330h40v8h-40z"/>
    <path d="M98 342h30v9H98zM132 342h24v9h-24zM160 342h24v9h-24zM188 342h24v9h-24zM216 342h24v9h-24zM244 342h24v9h-24zM272 342h24v9h-24zM300 342h24v9h-24zM328 342h24v9h-24zM356 342h24v9h-24zM384 342h24v9h-24zM412 342h24v9h-24zM440 342h24v9h-24zM468 342h24v9h-24zM496 342h46v9h-46z"/>
    <path d="M90 355h38v10H90zM132 355h26v10h-26zM162 355h26v10h-26zM192 355h26v10h-26zM222 355h26v10h-26zM252 355h26v10h-26zM282 355h26v10h-26zM312 355h26v10h-26zM342 355h26v10h-26zM372 355h26v10h-26zM402 355h26v10h-26zM432 355h26v10h-26zM462 355h26v10h-26zM492 355h58v10h-58z"/>
    <path d="M196 369h248v10H196z"/>
  </g>
  <!-- trackpad -->
  <rect x="258" y="384" width="124" height="16" rx="4" fill="#141a3a" stroke="#36407a"/>
</svg>
