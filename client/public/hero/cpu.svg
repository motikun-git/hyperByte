<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360">
  <defs>
    <linearGradient id="sub" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2f55"/>
      <stop offset="1" stop-color="#0b142c"/>
