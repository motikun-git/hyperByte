<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340">
  <defs>
    <linearGradient id="shroud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#252d5c"/>
      <stop offset="0.45" stop-color="#151b3d"/>
      <stop offset="1" stop-color="#0a0e22"/>
    </linearGradient>
    <linearGradient id="facet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a447d" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#1a2149" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="rgb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="0.5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef1fb"/>
      <stop offset="0.5" stop-color="#9aa3c4"/>
      <stop offset="1" stop-color="#d7dcef"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3d88d"/>
      <stop offset="1" stop-color="#b88a2e"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b4682"/>
      <stop offset="1" stop-color="#121736"/>
    </linearGradient>
    <radialGradient id="hub" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#f5f7ff"/>
      <stop offset="0.55" stop-color="#8d96bb"/>
      <stop offset="1" stop-color="#3a4166"/>
    </radialGradient>
    <radialGradient id="fanbg" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.25" stop-color="#05070f"/>
      <stop offset="1" stop-color="#0d1230"/>
    </radialGradient>
    <radialGradient id="spin" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.3" stop-color="#8B5CF6" stop-opacity="0"/>
      <stop offset="0.85" stop-color="#8B5CF6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0.05"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-200%" width="140%" height="500%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <g id="fan">
      <circle r="100" fill="#0a0e22" stroke="#2c3567" stroke-width="3"/>
      <circle r="92" fill="url(#fanbg)"/>
      <g fill="url(#blade)" stroke="#5560a0" stroke-width="1.2" stroke-opacity="0.6">
        <path id="b" d="M10 -18 C 40 -40, 78 -42, 88 -20 C 70 -14, 40 -6, 18 4 Z"/>
        <use href="#b" transform="rotate(40)"/>
        <use href="#b" transform="rotate(80)"/>
        <use href="#b" transform="rotate(120)"/>
        <use href="#b" transform="rotate(160)"/>
        <use href="#b" transform="rotate(200)"/>
        <use href="#b" transform="rotate(240)"/>
        <use href="#b" transform="rotate(280)"/>
        <use href="#b" transform="rotate(320)"/>
      </g>
      <circle r="92" fill="url(#spin)"/>
      <circle r="27" fill="url(#hub)"/>
      <circle r="27" fill="none" stroke="#0a0e22" stroke-width="2"/>
      <circle r="9" fill="#0a0e22" opacity="0.6"/>
    </g>
  </defs>

  <!-- PCB edge and backplate -->
  <rect x="62" y="44" width="660" height="252" rx="16" fill="#070a18"/>
  <rect x="62" y="270" width="660" height="18" rx="4" fill="#141b3a"/>

  <!-- Shroud -->
  <rect x="44" y="28" width="684" height="246" rx="22" fill="url(#shroud)" stroke="#323b72" stroke-width="2"/>
  <path d="M44 120 L120 28 L300 28 L230 120 Z" fill="url(#facet)" opacity="0.55"/>
  <path d="M728 190 L640 274 L470 274 L560 190 Z" fill="url(#facet)" opacity="0.45"/>
  <path d="M380 28 L400 274" stroke="#2c3567" stroke-width="2"/>
  <path d="M60 252 L712 252" stroke="#0a0d1f" stroke-width="3" opacity="0.6"/>

  <!-- Heatsink fins seen through the end cut-out -->
  <g>
    <rect x="652" y="70" width="56" height="160" rx="8" fill="#05070f"/>
    <g stroke="#566199" stroke-width="2">
      <path d="M660 76v148M668 76v148M676 76v148M684 76v148M692 76v148M700 76v148"/>
    </g>
  </g>

  <!-- Fans -->
  <use href="#fan" transform="translate(222 151)"/>
  <use href="#fan" transform="translate(500 151)"/>

  <!-- RGB light strip -->
  <rect x="96" y="22" width="580" height="7" rx="3.5" fill="url(#rgb)" filter="url(#glow)" opacity="0.9"/>
  <rect x="96" y="23" width="580" height="5" rx="2.5" fill="url(#rgb)"/>

  <!-- Power connector -->
  <rect x="610" y="8" width="70" height="22" rx="4" fill="#0b0e1c" stroke="#2c3567"/>
  <g fill="#1d2448"><rect x="616" y="13" width="8" height="12" rx="2"/><rect x="628" y="13" width="8" height="12" rx="2"/><rect x="640" y="13" width="8" height="12" rx="2"/><rect x="652" y="13" width="8" height="12" rx="2"/><rect x="664" y="13" width="8" height="12" rx="2"/></g>

  <!-- PCIe gold fingers -->
  <rect x="170" y="294" width="300" height="28" rx="3" fill="#0b0f22"/>
  <g fill="url(#gold)">
    <rect x="176" y="298" width="6" height="22" rx="1"/><rect x="186" y="298" width="6" height="22" rx="1"/><rect x="196" y="298" width="6" height="22" rx="1"/><rect x="206" y="298" width="6" height="22" rx="1"/><rect x="216" y="298" width="6" height="22" rx="1"/>
    <rect x="236" y="298" width="6" height="22" rx="1"/><rect x="246" y="298" width="6" height="22" rx="1"/><rect x="256" y="298" width="6" height="22" rx="1"/><rect x="266" y="298" width="6" height="22" rx="1"/><rect x="276" y="298" width="6" height="22" rx="1"/><rect x="286" y="298" width="6" height="22" rx="1"/><rect x="296" y="298" width="6" height="22" rx="1"/><rect x="306" y="298" width="6" height="22" rx="1"/><rect x="316" y="298" width="6" height="22" rx="1"/><rect x="326" y="298" width="6" height="22" rx="1"/><rect x="336" y="298" width="6" height="22" rx="1"/><rect x="346" y="298" width="6" height="22" rx="1"/><rect x="356" y="298" width="6" height="22" rx="1"/><rect x="366" y="298" width="6" height="22" rx="1"/><rect x="376" y="298" width="6" height="22" rx="1"/><rect x="386" y="298" width="6" height="22" rx="1"/><rect x="396" y="298" width="6" height="22" rx="1"/><rect x="406" y="298" width="6" height="22" rx="1"/><rect x="416" y="298" width="6" height="22" rx="1"/><rect x="426" y="298" width="6" height="22" rx="1"/><rect x="436" y="298" width="6" height="22" rx="1"/><rect x="446" y="298" width="6" height="22" rx="1"/><rect x="456" y="298" width="6" height="22" rx="1"/>
  </g>

  <!-- Bracket with ports -->
  <path d="M8 18 H40 V300 H24 L16 318 H8 Z" fill="url(#metal)"/>
  <g fill="#1b2140">
    <rect x="15" y="44" width="18" height="34" rx="3"/>
    <rect x="15" y="88" width="18" height="34" rx="3"/>
    <rect x="15" y="132" width="18" height="34" rx="3"/>
    <rect x="15" y="176" width="18" height="28" rx="4"/>
  </g>
  <g stroke="#6e7799" stroke-width="2" stroke-linecap="round"><path d="M18 220v60M26 220v60M34 220v60"/></g>
</svg>
