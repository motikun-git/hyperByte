<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 180">
  <defs>
    <linearGradient id="spreader" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3368"/>
      <stop offset="0.5" stop-color="#161c40"/>
      <stop offset="1" stop-color="#0b0f24"/>
    </linearGradient>
    <linearGradient id="rgb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.35" stop-color="#3B82F6"/>
      <stop offset="0.7" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#A855F7"/>
